name: Deploy privacy policy

# Deploys privacy/; path push also re-registers this workflow after a repo recreate.
on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - privacy/**
      - .github/workflows/deploy-privacy.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish privacy page
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare site
        run: |
          mkdir -p _site/privacy
          cp -R privacy/. _site/privacy/

      - name: Upload privacy site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
