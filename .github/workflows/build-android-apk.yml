name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK
        run: |
          set -eux
          ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/android-cmdline
          mv /tmp/android-cmdline/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME"
          } >> "$GITHUB_ENV"
          {
            echo "$ANDROID_HOME/cmdline-tools/latest/bin"
            echo "$ANDROID_HOME/platform-tools"
          } >> "$GITHUB_PATH"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Point Flutter at Android SDK
        run: flutter config --android-sdk "$ANDROID_HOME"

      # Same secrets as Build signed Android AAB / RuStore upload.
      - name: Restore release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret $name. Add the four ANDROID_* secrets from docs/ru/android-release.md"
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=app/upload-keystore.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Build signed release APK
        run: flutter build apk --release

      - name: Verify signed APK
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk
          test -f "$apk"
          ls -lh "$apk"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          if [ ! -x "$apksigner" ]; then
            echo "::error::apksigner not found at $apksigner"
            exit 1
          fi
          # Fail if Gradle fell back to the debug keystore.
          if "$apksigner" verify --print-certs "$apk" | grep -qi 'CN=Android Debug'; then
            echo "::error::APK is still debug-signed; release keystore was not applied."
            exit 1
          fi
          "$apksigner" verify --print-certs "$apk" | head -20
          cp "$apk" "$RUNNER_TEMP/tamtoot.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tamtoot-apk
          path: ${{ runner.temp }}/tamtoot.apk
          if-no-files-found: error
          retention-days: 14
